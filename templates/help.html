<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="Shengyuan Wang">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        h4 {
            color: #063970;
        }
        .highlight {
            font-weight: bold;
        }
        .section-spacing {
            margin-top: 30px; /* Extra space between High-confidence and Constitutive sections */
        }
        .separator-line {
            border-top: 2px solid #ddd;
            margin: 10px 0;
        }
    </style>
  </head>

  <body class="bg-light">
    {% include "header.html" %}

    <div class="container my-5">
        <div class="py-3">
          <h4 class="mt-4 highlight">Home Page Overview</h4>
          <div class="separator-line"></div>
          <img src="{{ url_for('static', filename='data/help_index.png') }}" alt="CTCF Image" width="1200">

          <h4 class="mt-4 highlight">Loci Search Results</h4>
          <div class="separator-line"></div>
          <img src="{{ url_for('static', filename='data/help_loci.png') }}" alt="CTCF Image" width="1200">

          <h4 class="mt-4 highlight">Union Site Search Results</h4>
          <div class="separator-line"></div>
          <img src="{{ url_for('static', filename='data/help_union.png') }}" alt="CTCF Image" width="1200">

          <h4 class="mt-4 highlight">Cell Type Search Results</h4>
          <div class="separator-line"></div>
          <img src="{{ url_for('static', filename='data/help_ct.png') }}" alt="CTCF Image" width="1200">
        </div>
    </div>

    {% include "footer.html" %}

    <!-- Local JS files -->
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popper-1.14.3.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
  </body>
</html>
